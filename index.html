<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0f1c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Medication Database</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --bg: #0a0f1c;
            --bg-elevated: #111827;
            --bg-card: #1a2332;
            --fg: #f1f5f9;
            --fg-muted: #94a3b8;
            --accent: #10b981;
            --accent-hover: #34d399;
            --accent-glow: rgba(16, 185, 129, 0.3);
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.2);
            --border: #2d3a4f;
            --header-bg: #0f172a;
            --shadow: rgba(0, 0, 0, 0.2);
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --bg-elevated: #ffffff;
            --bg-card: #ffffff;
            --fg: #0f172a;
            --fg-muted: #64748b;
            --accent: #059669;
            --accent-hover: #10b981;
            --accent-glow: rgba(5, 150, 105, 0.2);
            --border: #e2e8f0;
            --header-bg: #ffffff;
            --shadow: rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 20% 0%, rgba(16, 185, 129, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(59, 130, 246, 0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        [data-theme="light"] body::before {
            background: 
                radial-gradient(ellipse 80% 50% at 20% 0%, rgba(16, 185, 129, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(59, 130, 246, 0.04) 0%, transparent 50%);
        }

        .pull-indicator {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%) translateY(-60px);
            background: var(--accent);
            color: white;
            padding: 8px 20px;
            border-radius: 0 0 20px 20px;
            font-size: 13px;
            font-weight: 600;
            z-index: 1000;
            transition: transform 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pull-indicator.visible {
            transform: translateX(-50%) translateY(0);
        }

        .pull-indicator .material-icons {
            font-size: 18px;
        }

        .app-header {
            background: linear-gradient(180deg, var(--header-bg) 0%, rgba(15, 23, 42, 0.95) 100%);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        [data-theme="light"] .app-header {
            background: linear-gradient(180deg, var(--header-bg) 0%, rgba(255, 255, 255, 0.95) 100%);
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px 24px;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 16px;
        }

        .title-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent) 0%, #059669 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px var(--accent-glow);
            flex-shrink: 0;
        }

        .logo-icon .material-icons {
            color: white;
            font-size: 24px;
        }

        .title-block h1 {
            margin: 0;
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(18px, 3vw, 24px);
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--fg);
            transition: color 0.3s ease;
        }

        .title-block .page-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 4px;
        }

        .page-date {
            font-size: 13px;
            color: var(--fg-muted);
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .freshness-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 6px;
            background: var(--bg-card);
            color: var(--fg-muted);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .freshness-badge.fresh {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            white-space: nowrap;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 2px 8px var(--accent-glow);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--fg);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-elevated);
            border-color: var(--accent);
        }

        .btn-secondary.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .btn-icon {
            padding: 10px;
            min-width: 44px;
            justify-content: center;
        }

        .btn .material-icons {
            font-size: 18px;
        }

        .btn.spin .material-icons {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .tabs-wrapper {
            display: flex;
            gap: 4px;
            background: var(--bg);
            padding: 4px;
            border-radius: 12px;
            width: fit-content;
            transition: background 0.3s ease;
        }

        .tab-btn {
            padding: 10px 28px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            background: transparent;
            color: var(--fg-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            font-family: inherit;
        }

        .tab-btn:hover {
            color: var(--fg);
            background: rgba(255, 255, 255, 0.05);
        }

        [data-theme="light"] .tab-btn:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 2px 8px var(--accent-glow);
        }

        .tab-btn .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            font-size: 11px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin-left: 8px;
        }

        .tab-btn:not(.active) .badge {
            background: var(--border);
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
            position: relative;
            z-index: 1;
        }

        .definition-box {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(59, 130, 246, 0.05) 100%);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-left: 4px solid var(--accent);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 20px;
            display: none;
        }

        .definition-box.visible {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .definition-box p {
            margin: 0;
            font-size: 14px;
            line-height: 1.7;
            color: var(--fg);
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            min-width: 200px;
            max-width: 400px;
        }

        .search-wrapper .material-icons {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--fg-muted);
            font-size: 20px;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .search-input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            font-size: 15px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--fg);
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .search-input::placeholder {
            color: var(--fg-muted);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .view-toggles {
            display: flex;
            gap: 4px;
            background: var(--bg-card);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .view-btn {
            padding: 8px 12px;
            background: transparent;
            border: none;
            color: var(--fg-muted);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
        }

        .view-btn:hover {
            color: var(--fg);
        }

        .view-btn.active {
            background: var(--accent);
            color: white;
        }

        .view-btn .material-icons {
            font-size: 18px;
        }

        .loading-state {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .loading-state p {
            color: var(--fg-muted);
            font-size: 15px;
            margin: 0;
        }

        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 24px var(--shadow);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) var(--bg);
        }

        .table-wrapper::-webkit-scrollbar {
            height: 8px;
        }

        .table-wrapper::-webkit-scrollbar-track {
            background: var(--bg);
            border-radius: 4px;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        .scroll-hint {
            display: none;
            padding: 12px 16px;
            background: rgba(16, 185, 129, 0.1);
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            color: var(--fg-muted);
            text-align: center;
        }

        .scroll-hint .material-icons {
            font-size: 16px;
            vertical-align: middle;
            margin-right: 6px;
            animation: swipeHint 1.5s ease-in-out infinite;
        }

        @keyframes swipeHint {
            0%, 100% { transform: translateX(-4px); }
            50% { transform: translateX(4px); }
        }

        #dataTable {
            width: 100% !important;
            border-collapse: collapse !important;
            min-width: 800px;
        }

        #dataTable thead {
            background: var(--bg-elevated);
        }

        #dataTable th {
            background: transparent;
            color: var(--fg);
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 16px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        #dataTable td {
            padding: 16px 14px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
            font-size: 14px;
            line-height: 1.6;
            color: var(--fg);
            background: transparent;
            transition: border-color 0.3s ease;
        }

        #dataTable tbody tr {
            transition: background 0.15s ease;
        }

        #dataTable tbody tr:hover {
            background: rgba(16, 185, 129, 0.05);
        }

        [data-theme="light"] #dataTable tbody tr:hover {
            background: rgba(16, 185, 129, 0.08);
        }

        #dataTable tbody tr:last-child td {
            border-bottom: none;
        }

        #dataTable td:first-child {
            font-weight: 600;
            color: var(--accent);
        }

        .fav-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: var(--fg-muted);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fav-btn:hover {
            transform: scale(1.2);
        }

        .fav-btn.active {
            color: #f43f5e;
        }

        .fav-btn .material-icons {
            font-size: 22px;
        }

        .table-img {
            width: 72px;
            height: 72px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid var(--border);
            transition: all 0.2s ease;
            background: var(--bg);
        }

        .table-img:hover {
            transform: scale(1.08);
            border-color: var(--accent);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .no-image, .img-error {
            color: var(--fg-muted);
            font-style: italic;
            font-size: 13px;
        }

        .img-error {
            color: var(--danger);
        }

        .bold-text {
            font-weight: 700;
            color: var(--fg);
        }

        /* Card View Styles */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .med-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .med-card:hover {
            border-color: var(--accent);
            box-shadow: 0 8px 32px var(--shadow);
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .card-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid var(--border);
            flex-shrink: 0;
            background: var(--bg);
        }

        .card-title-section {
            flex: 1;
            min-width: 0;
        }

        .card-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
            margin: 0 0 4px 0;
            line-height: 1.3;
        }

        .card-fav-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: var(--fg-muted);
            transition: all 0.2s ease;
        }

        .card-fav-btn:hover {
            transform: scale(1.2);
        }

        .card-fav-btn.active {
            color: #f43f5e;
        }

        .card-fav-btn .material-icons {
            font-size: 24px;
        }

        .card-body {
            padding: 16px;
        }

        .card-field {
            margin-bottom: 12px;
        }

        .card-field:last-child {
            margin-bottom: 0;
        }

        .card-field-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--fg-muted);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .card-field-value {
            font-size: 14px;
            color: var(--fg);
            line-height: 1.5;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        .error-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--bg-card);
            border: 1px solid var(--danger);
            border-radius: 16px;
        }

        .error-state .material-icons {
            font-size: 48px;
            color: var(--danger);
            margin-bottom: 16px;
        }

        .error-state h3 {
            margin: 0 0 8px;
            color: var(--fg);
            font-size: 18px;
        }

        .error-state p {
            margin: 0;
            color: var(--fg-muted);
            font-size: 14px;
        }

        .dataTables_empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--fg-muted);
            font-size: 15px;
        }

        @media print {
            body {
                background: white !important;
                color: black !important;
            }
            body::before { display: none; }
            .app-header {
                position: relative;
                background: white !important;
                box-shadow: none;
                border-bottom: 2px solid black;
            }
            .header-actions, .tabs-wrapper, .search-container, .view-toggles, .fav-btn, .btn {
                display: none !important;
            }
            .main-container { padding: 0; max-width: none; }
            .table-container {
                border: 1px solid #ccc;
                border-radius: 0;
                box-shadow: none;
            }
            .scroll-hint { display: none !important; }
            .table-wrapper { overflow: visible; }
            #dataTable { min-width: auto; }
            #dataTable th, #dataTable td {
                border: 1px solid #ccc;
                padding: 8px;
                color: black;
            }
            #dataTable th { background: #f0f0f0 !important; }
            .table-img { width: 50px; height: 50px; }
        }

        @media (max-width: 768px) {
            .header-inner { padding: 12px 16px; }
            .header-top {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .header-actions {
                width: 100%;
                justify-content: flex-start;
            }
            .btn { padding: 8px 12px; font-size: 13px; }
            .btn-icon { padding: 8px; }
            .tabs-wrapper { width: 100%; }
            .tab-btn { flex: 1; text-align: center; padding: 12px 16px; }
            .main-container { padding: 16px; }
            .controls-row {
                flex-direction: column;
                align-items: stretch;
            }
            .search-wrapper { max-width: none; }
            .view-toggles { justify-content: center; }
            #dataTable th, #dataTable td { padding: 12px 10px; font-size: 13px; }
            .table-img { width: 56px; height: 56px; }
            .scroll-hint { display: block; }
            .cards-container { grid-template-columns: 1fr; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="pull-indicator" id="pullIndicator">
        <span class="material-icons">refresh</span>
        <span>Release to refresh</span>
    </div>

    <div class="app-header">
        <div class="header-inner">
            <div class="header-top">
                <div class="title-section">
                    <div class="logo-icon">
                        <span class="material-icons">medication</span>
                    </div>
                    <div class="title-block">
                        <h1 id="pageTitle">MEDICATION DATABASE</h1>
                        <div class="page-meta">
                            <span class="page-date" id="pageDate"></span>
                            <span class="freshness-badge" id="freshnessBadge">Loading...</span>
                        </div>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="btn btn-secondary btn-icon" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle dark/light mode">
                        <span class="material-icons" id="themeIcon">dark_mode</span>
                    </button>
                    <button class="btn btn-secondary btn-icon" id="favFilterBtn" onclick="toggleFavoritesFilter()" title="Show favorites only">
                        <span class="material-icons">favorite_border</span>
                    </button>
                    <button id="refreshBtn" class="btn btn-secondary" onclick="forceRefresh()">
                        <span class="material-icons">refresh</span>
                        <span class="btn-text">Refresh</span>
                    </button>
                    <a id="pdfButton" href="#" target="_blank" class="btn btn-primary" style="display: none;">
                        <span class="material-icons">download</span>
                        <span class="btn-text">PDF</span>
                    </a>
                </div>
            </div>
            <div class="tabs-wrapper">
                <button class="tab-btn active" data-tab="injection" onclick="switchTab('injection')">
                    Injection
                    <span class="badge" id="injection-count">-</span>
                </button>
                <button class="tab-btn" data-tab="oral" onclick="switchTab('oral')">
                    Oral
                    <span class="badge" id="oral-count">-</span>
                </button>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div id="pageDefinition" class="definition-box"></div>

        <div class="controls-row">
            <div class="search-wrapper">
                <span class="material-icons">search</span>
                <input type="text" id="customSearch" class="search-input" placeholder="Search medications...">
            </div>
            <div class="view-toggles">
                <button class="view-btn active" data-view="table" onclick="switchView('table')">
                    <span class="material-icons">table_rows</span>
                    Table
                </button>
                <button class="view-btn" data-view="cards" onclick="switchView('cards')">
                    <span class="material-icons">grid_view</span>
                    Cards
                </button>
            </div>
        </div>

        <div id="loadingState" class="loading-state">
            <div class="loading-spinner"></div>
            <p>Loading medication data...</p>
        </div>

        <div id="errorState" class="error-state" style="display: none;">
            <span class="material-icons">error_outline</span>
            <h3>Failed to Load Data</h3>
            <p>Please check your connection and try again.</p>
        </div>

        <div id="tableContainer" class="table-container" style="display: none;">
            <div class="scroll-hint">
                <span class="material-icons">swipe</span>
                Scroll left/right to see more columns
            </div>
            <div class="table-wrapper">
                <table id="dataTable">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div id="cardsContainer" class="cards-container" style="display: none;"></div>
    </div>

    <div id="imgModal" class="modal" onclick="closeModal()">
        <button class="modal-close" aria-label="Close modal">
            <span class="material-icons">close</span>
        </button>
        <img class="modal-content" id="modalImg" alt="Medication image enlarged">
    </div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>
    // Configuration
    const SHEET_ID = '1pSOW0oQ2J09Oq_q2O1d8nOnWwzUQ_daoSUixHxI9xYQ';
    
    const TABS_CONFIG = {
        injection: { gid: '0', name: 'Injection' },
        oral: { gid: '1948005281', name: 'Oral' }
    };

    const CONFIG_COLUMNS = ['CONFIG_TITLE', 'CONFIG_PDF', 'CONFIG_DATE', 'CONFIG_DEFINITION'];
    const CACHE_KEY_PREFIX = 'medAppCache_v13_';
    const FAVORITES_KEY = 'medApp_favorites';
    const THEME_KEY = 'medApp_theme';
    
    // State
    let currentTab = 'injection';
    let currentView = 'table';
    let dataTableInstance = null;
    let allData = { injection: null, oral: null };
    let favorites = new Set();
    let showFavoritesOnly = false;
    let lastRefreshTime = null;

    // Initialization
    function init() {
        loadTheme();
        loadFavorites();
        loadAllData();
        setupPullToRefresh();
        setupSearch();
        setupAutoRefresh();
    }

    // Theme
    function loadTheme() {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            document.getElementById('themeIcon').textContent = 'light_mode';
        }
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme');
        const newTheme = current === 'light' ? 'dark' : 'light';
        
        if (newTheme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            document.getElementById('themeIcon').textContent = 'light_mode';
        } else {
            document.documentElement.removeAttribute('data-theme');
            document.getElementById('themeIcon').textContent = 'dark_mode';
        }
        
        localStorage.setItem(THEME_KEY, newTheme);
    }

    // Favorites
    function loadFavorites() {
        try {
            const saved = localStorage.getItem(FAVORITES_KEY);
            if (saved) favorites = new Set(JSON.parse(saved));
        } catch (e) {
            favorites = new Set();
        }
    }

    function saveFavorites() {
        localStorage.setItem(FAVORITES_KEY, JSON.stringify([...favorites]));
    }

    function toggleFavorite(medName) {
        if (favorites.has(medName)) {
            favorites.delete(medName);
        } else {
            favorites.add(medName);
        }
        saveFavorites();
        updateFavoriteButtons();
        
        if (showFavoritesOnly) {
            renderTable(currentTab);
            renderCards(currentTab);
        }
    }

    function toggleFavoritesFilter() {
        showFavoritesOnly = !showFavoritesOnly;
        const btn = document.getElementById('favFilterBtn');
        
        if (showFavoritesOnly) {
            btn.classList.add('active');
            btn.querySelector('.material-icons').textContent = 'favorite';
        } else {
            btn.classList.remove('active');
            btn.querySelector('.material-icons').textContent = 'favorite_border';
        }
        
        renderTable(currentTab);
        renderCards(currentTab);
    }

    function updateFavoriteButtons() {
        document.querySelectorAll('.fav-btn, .card-fav-btn').forEach(btn => {
            const name = btn.dataset.name;
            const isFav = favorites.has(name);
            btn.classList.toggle('active', isFav);
            const icon = btn.querySelector('.material-icons');
            if (icon) icon.textContent = isFav ? 'favorite' : 'favorite_border';
        });
    }

    // Utilities
    function getCsvUrl(gid) {
        return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;
    }

    function getImageUrl(rawUrl) {
        if (!rawUrl || !rawUrl.trim()) return null;
        let url = rawUrl.trim();
        let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
        let id = match ? match[1] : null;
        if (!id) {
            match = url.match(/id=([a-zA-Z0-9_-]+)/);
            if (match) id = match[1];
        }
        if (id) return `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;
        if (url.match(/\.(jpeg|jpg|gif|png|webp)$/i)) return url;
        return null;
    }

    function getPdfViewUrl(rawUrl) {
        if (!rawUrl || !rawUrl.trim()) return null;
        let url = rawUrl.trim();
        let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
        let id = match ? match[1] : null;
        if (!id) {
            match = url.match(/id=([a-zA-Z0-9_-]+)/);
            if (match) id = match[1];
        }
        if (id) return `https://drive.google.com/file/d/${id}/view`;
        return url;
    }

    function parseBoldText(text) {
        if (!text) return '';
        let result = text.toString();
        result = result.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        result = result.replace(/&lt;b&gt;/gi, '<b>').replace(/&lt;\/b&gt;/gi, '</b>')
                       .replace(/&lt;strong&gt;/gi, '<strong>').replace(/&lt;\/strong&gt;/gi, '</strong>');
        result = result.replace(/\*\*([^*]+)\*\*/g, '<b class="bold-text">$1</b>');
        result = result.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        return result;
    }

    function updateFreshness() {
        const badge = document.getElementById('freshnessBadge');
        if (!lastRefreshTime) {
            badge.textContent = 'No data';
            badge.classList.remove('fresh');
            return;
        }
        const mins = Math.floor((Date.now() - lastRefreshTime) / 60000);
        if (mins < 1) {
            badge.textContent = 'Just now';
            badge.classList.add('fresh');
        } else if (mins < 60) {
            badge.textContent = `${mins}m ago`;
            badge.classList.add('fresh');
        } else {
            badge.textContent = `${Math.floor(mins / 60)}h ago`;
            badge.classList.remove('fresh');
        }
    }

    // Data Fetching
    async function fetchTabData(tabKey, force = false) {
        const config = TABS_CONFIG[tabKey];
        const cacheKey = CACHE_KEY_PREFIX + tabKey;
        const now = Date.now();
        
        if (!force) {
            const cachedRaw = localStorage.getItem(cacheKey);
            if (cachedRaw) {
                try {
                    const cached = JSON.parse(cachedRaw);
                    if (cached.timestamp && (now - cached.timestamp < 300000)) {
                        return cached.data;
                    }
                } catch (e) {}
            }
        }

        const response = await fetch(getCsvUrl(config.gid));
        if (!response.ok) throw new Error('Network error');
        
        const csvText = await response.text();
        const result = Papa.parse(csvText, { header: true, skipEmptyLines: true });
        
        localStorage.setItem(cacheKey, JSON.stringify({ timestamp: now, data: result.data }));
        return result.data;
    }

    async function loadAllData(forceRefresh = false) {
        const refreshBtn = document.getElementById('refreshBtn');
        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const tableContainer = document.getElementById('tableContainer');
        const cardsContainer = document.getElementById('cardsContainer');
        
        if (forceRefresh) refreshBtn.classList.add('spin');
        
        loadingState.style.display = 'block';
        errorState.style.display = 'none';
        tableContainer.style.display = 'none';
        cardsContainer.style.display = 'none';

        try {
            const [injectionData, oralData] = await Promise.all([
                fetchTabData('injection', forceRefresh),
                fetchTabData('oral', forceRefresh)
            ]);

            allData.injection = injectionData;
            allData.oral = oralData;
            lastRefreshTime = Date.now();

            document.getElementById('injection-count').textContent = injectionData ? injectionData.length : '0';
            document.getElementById('oral-count').textContent = oralData ? oralData.length : '0';

            loadingState.style.display = 'none';
            
            // FIX: Properly show correct view after loading
            if (currentView === 'table') {
                tableContainer.style.display = 'block';
                renderTable(currentTab);
            } else {
                cardsContainer.style.display = 'grid';
                renderCards(currentTab);
            }
            
            updateFreshness();

        } catch (error) {
            console.error('Load error:', error);
            loadingState.style.display = 'none';
            errorState.style.display = 'block';
        } finally {
            refreshBtn.classList.remove('spin');
        }
    }

    // Table Rendering
    function renderTable(tabKey) {
        let data = allData[tabKey];
        if (!data || data.length === 0) return;

        if (showFavoritesOnly) {
            const nameCol = Object.keys(data[0]).find(k => !CONFIG_COLUMNS.includes(k));
            data = data.filter(row => favorites.has(row[nameCol]));
        }

        if (data.length === 0) {
            if (dataTableInstance) dataTableInstance.clear().draw();
            return;
        }

        const firstRow = data[0];

        // Update page info
        document.getElementById('pageTitle').textContent = firstRow['CONFIG_TITLE'] || `${TABS_CONFIG[tabKey].name} Medications`;
        document.title = firstRow['CONFIG_TITLE'] || `${TABS_CONFIG[tabKey].name} Medications`;
        document.getElementById('pageDate').textContent = firstRow['CONFIG_DATE'] || '';

        const definitionEl = document.getElementById('pageDefinition');
        if (firstRow['CONFIG_DEFINITION']) {
            definitionEl.innerHTML = `<p>${parseBoldText(firstRow['CONFIG_DEFINITION'])}</p>`;
            definitionEl.classList.add('visible');
        } else {
            definitionEl.classList.remove('visible');
        }

        const pdfBtn = document.getElementById('pdfButton');
        if (firstRow['CONFIG_PDF']) {
            const pdfUrl = getPdfViewUrl(firstRow['CONFIG_PDF']);
            if (pdfUrl) {
                pdfBtn.href = pdfUrl;
                pdfBtn.style.display = 'inline-flex';
            } else {
                pdfBtn.style.display = 'none';
            }
        } else {
            pdfBtn.style.display = 'none';
        }

        const allHeaders = Object.keys(firstRow);
        const tableHeaders = allHeaders.filter(h => !CONFIG_COLUMNS.includes(h));

        if (dataTableInstance) {
            dataTableInstance.clear().destroy();
            $('#dataTable').empty();
        }

        let tableHtml = '<thead><tr><th></th>';
        tableHeaders.forEach(h => tableHtml += `<th>${h}</th>`);
        tableHtml += '</tr></thead><tbody></tbody>';
        $('#dataTable').html(tableHtml);

        const columnsConfig = [
            {
                data: null,
                orderable: false,
                render: (data, type, row) => {
                    const name = row[tableHeaders[0]];
                    const isFav = favorites.has(name);
                    return `<button class="fav-btn ${isFav ? 'active' : ''}" data-name="${name.replace(/"/g, '&quot;')}" onclick="toggleFavorite('${name.replace(/'/g, "\\'")}')">
                        <span class="material-icons">${isFav ? 'favorite' : 'favorite_border'}</span>
                    </button>`;
                }
            },
            ...tableHeaders.map(key => ({
                data: key,
                render: (data, type, row) => {
                    if (!data) return '';
                    const rawVal = data.toString();
                    const imgUrl = getImageUrl(rawVal);
                    if (imgUrl) return `<img src="${imgUrl}" class="table-img" onclick="zoomImage('${imgUrl}')" onerror="this.outerHTML='<span class=\\'img-error\\'>Image Error</span>'" alt="Medication">`;
                    if (rawVal.toLowerCase() === 'no image') return '<span class="no-image">No Image</span>';
                    return parseBoldText(rawVal);
                }
            }))
        ];

        dataTableInstance = $('#dataTable').DataTable({
            data: data,
            columns: columnsConfig,
            dom: 't',
            paging: false,
            info: false,
            ordering: true,
            searching: true,
            order: [],
            language: {
                emptyTable: showFavoritesOnly ? 'No favorites yet. Click the heart icon to add some!' : 'No medications found',
                zeroRecords: 'No matching medications found'
            },
            initComplete: function() {
                const currentSearch = $('#customSearch').val();
                if (currentSearch) this.api().search(currentSearch).draw();
            }
        });
    }

    // Card Rendering
    function renderCards(tabKey) {
        let data = allData[tabKey];
        const container = document.getElementById('cardsContainer');
        
        if (!data || data.length === 0) {
            container.innerHTML = '<p style="color: var(--fg-muted); text-align: center; padding: 40px;">No data available</p>';
            return;
        }

        const firstRow = data[0];
        const allHeaders = Object.keys(firstRow);
        const tableHeaders = allHeaders.filter(h => !CONFIG_COLUMNS.includes(h));
        
        if (showFavoritesOnly) {
            const nameCol = tableHeaders[0];
            data = data.filter(row => favorites.has(row[nameCol]));
        }

        if (data.length === 0) {
            container.innerHTML = '<p style="color: var(--fg-muted); text-align: center; padding: 40px;">No favorites yet. Click the heart icon to add some!</p>';
            return;
        }

        const searchTerm = $('#customSearch').val().toLowerCase();
        if (searchTerm) {
            data = data.filter(row => tableHeaders.some(h => row[h] && row[h].toString().toLowerCase().includes(searchTerm)));
        }

        let html = '';
        data.forEach(row => {
            const nameCol = tableHeaders[0];
            const name = row[nameCol] || 'Unknown';
            const isFav = favorites.has(name);
            
            let imgUrl = null, imgCol = null;
            for (const h of tableHeaders) {
                if (row[h]) {
                    const url = getImageUrl(row[h].toString());
                    if (url) { imgUrl = url; imgCol = h; break; }
                }
            }

            html += `<div class="med-card">
                <div class="card-header">
                    ${imgUrl ? `<img src="${imgUrl}" class="card-img" onclick="zoomImage('${imgUrl}')" alt="${name}">` : `<div class="card-img" style="display: flex; align-items: center; justify-content: center; color: var(--fg-muted); font-size: 12px;">No image</div>`}
                    <div class="card-title-section">
                        <h3 class="card-title">${parseBoldText(name)}</h3>
                    </div>
                    <button class="card-fav-btn ${isFav ? 'active' : ''}" data-name="${name.replace(/"/g, '&quot;')}" onclick="toggleFavorite('${name.replace(/'/g, "\\'")}')">
                        <span class="material-icons">${isFav ? 'favorite' : 'favorite_border'}</span>
                    </button>
                </div>
                <div class="card-body">`;

            tableHeaders.forEach(h => {
                if (h === nameCol || h === imgCol) return;
                let val = row[h];
                if (!val) return;
                const valStr = val.toString();
                if (valStr.toLowerCase() === 'no image' || getImageUrl(valStr)) return;
                
                html += `<div class="card-field">
                    <div class="card-field-label">${h}</div>
                    <div class="card-field-value">${parseBoldText(valStr)}</div>
                </div>`;
            });

            html += `</div></div>`;
        });

        container.innerHTML = html || '<p style="color: var(--fg-muted); text-align: center; padding: 40px;">No matching medications found</p>';
    }

    // View Switching - FIXED
    function switchView(view) {
        currentView = view;
        
        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.view === view);
        });

        const tableContainer = document.getElementById('tableContainer');
        const cardsContainer = document.getElementById('cardsContainer');

        if (view === 'table') {
            tableContainer.style.display = 'block';
            cardsContainer.style.display = 'none';
            renderTable(currentTab);
        } else {
            tableContainer.style.display = 'none';
            cardsContainer.style.display = 'grid';
            renderCards(currentTab);
        }
    }

    // Tab Switching
    function switchTab(tabKey) {
        if (tabKey === currentTab) return;

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.tab === tabKey);
        });

        currentTab = tabKey;

        if (currentView === 'table') {
            renderTable(tabKey);
        } else {
            renderCards(tabKey);
        }
    }

    // UI Functions
    function forceRefresh() {
        Object.keys(TABS_CONFIG).forEach(key => localStorage.removeItem(CACHE_KEY_PREFIX + key));
        loadAllData(true);
    }

    function zoomImage(src) {
        const modal = document.getElementById('imgModal');
        const modalImg = document.getElementById('modalImg');
        modal.classList.add('active');
        modalImg.src = src;
    }

    function closeModal() {
        document.getElementById('imgModal').classList.remove('active');
    }

    // Pull to Refresh
    function setupPullToRefresh() {
        let startY = 0, pulling = false;
        const indicator = document.getElementById('pullIndicator');

        document.addEventListener('touchstart', e => {
            if (window.scrollY === 0) { startY = e.touches[0].pageY; pulling = true; }
        }, { passive: true });

        document.addEventListener('touchmove', e => {
            if (!pulling) return;
            const diff = e.touches[0].pageY - startY;
            indicator.classList.toggle('visible', diff > 80 && window.scrollY === 0);
        }, { passive: true });

        document.addEventListener('touchend', () => {
            if (indicator.classList.contains('visible')) forceRefresh();
            indicator.classList.remove('visible');
            pulling = false;
        }, { passive: true });
    }

    // Search
    function setupSearch() {
        $('#customSearch').on('keyup clear', function() {
            if (currentView === 'table' && dataTableInstance) {
                dataTableInstance.search($(this).val()).draw();
            } else if (currentView === 'cards') {
                renderCards(currentTab);
            }
        });
    }

    // Auto Refresh
    function setupAutoRefresh() {
        setInterval(updateFreshness, 60000);
        setInterval(() => loadAllData(false), 300000);
    }

    // Keyboard
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    // Start
    $(document).ready(init);
</script>
</body>
</html>
