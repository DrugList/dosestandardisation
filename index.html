<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Alert Medications - Injection & Oral</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            background-color: #f4f4f9; 
        }

        /* Header Styling - STICKY */
        .app-header {
            background: linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .title-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .app-header h1 {
            margin: 0;
            font-size: clamp(18px, 4vw, 26px);
            letter-spacing: 1px;
            line-height: 1.2;
        }

        #pageDate {
            font-size: clamp(12px, 2.5vw, 14px);
            opacity: 0.9;
            margin-top: 5px;
        }

        /* Container */
        .container { 
            max-width: 1400px; 
            margin: 20px auto; 
            background: white; 
            padding: 20px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1); 
            border-radius: 8px; 
        }

        /* Section Title */
        .section-title {
            background: linear-gradient(135deg, #1976d2 0%, #1565c0 100%);
            color: white;
            padding: 15px 20px;
            margin: 30px -20px 20px -20px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title:first-of-type {
            margin-top: 0;
        }

        .section-title .material-icons {
            font-size: 24px;
        }

        /* Control Row Layout */
        .control-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            position: sticky;
            top: 80px;
            background-color: white;
            z-index: 999;
            padding: 15px 0;
            margin-left: -20px;
            margin-right: -20px;
            padding-left: 20px;
            padding-right: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .search-wrapper { 
            flex-grow: 1; 
            min-width: 200px; 
        }

        .custom-search-input {
            width: 100%; 
            padding: 12px 20px; 
            font-size: 16px; 
            border: 2px solid #ddd; 
            border-radius: 6px;
            box-sizing: border-box; 
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .custom-search-input:focus { 
            border-color: #d32f2f; 
            outline: none;
            box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.1);
        }

        .button-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .download-group { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }

        .download-label { 
            font-size: 14px; 
            color: #555; 
            font-weight: 600; 
        }

        .header-btn {
            background-color: white; 
            color: #d32f2f; 
            padding: 10px 16px; 
            border-radius: 6px;
            text-decoration: none; 
            font-weight: bold; 
            font-size: 14px; 
            display: inline-flex;
            align-items: center; 
            gap: 5px; 
            transition: all 0.2s; 
            border: 2px solid #d32f2f; 
            cursor: pointer;
        }

        .header-btn:hover { 
            background-color: #fff5f5; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            transform: translateY(-1px);
        }

        #refreshBtn { 
            background-color: #2196f3; 
            color: white; 
            border-color: #2196f3; 
        }

        #refreshBtn:hover { 
            background-color: #1976d2; 
            border-color: #1976d2; 
        }

        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Table Styling */
        .dataTables_wrapper {
            margin-top: 10px;
        }

        table.dataTable {
            width: 100% !important;
            border-collapse: collapse;
        }

        table.dataTable thead th {
            background: linear-gradient(135deg, #1976d2 0%, #1565c0 100%);
            color: white;
            padding: 14px 12px;
            font-weight: bold;
            text-align: left;
            border: none;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        table.dataTable thead th:first-child {
            border-radius: 8px 0 0 8px;
        }

        table.dataTable thead th:last-child {
            border-radius: 0 8px 8px 0;
        }

        table.dataTable tbody tr {
            background-color: #fff;
            transition: background-color 0.2s;
        }

        table.dataTable tbody tr:hover {
            background-color: #f5f5f5;
        }

        table.dataTable tbody td {
            padding: 14px 12px;
            border-bottom: 1px solid #e0e0e0;
            vertical-align: top;
            line-height: 1.6;
        }

        table.dataTable tbody tr:last-child td {
            border-bottom: none;
        }

        /* Bold text styling - IMPORTANT */
        table.dataTable tbody td b,
        table.dataTable tbody td strong {
            color: #d32f2f;
            font-weight: 700;
        }

        /* First column - Medication Name */
        table.dataTable tbody td:first-child {
            font-weight: 600;
            color: #333;
            min-width: 150px;
        }

        /* Loading State */
        .loading-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .loading-state .material-icons {
            font-size: 48px;
            color: #1976d2;
            margin-bottom: 15px;
        }

        .loading-state p {
            margin: 5px 0;
            font-size: 16px;
        }

        .error-state {
            color: #d32f2f;
        }

        .error-state .material-icons {
            color: #d32f2f;
        }

        /* Modal */
        .modal { 
            display: none; 
            position: fixed; 
            z-index: 2000; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.85); 
            justify-content: center; 
            align-items: center; 
        }

        .modal-content { 
            max-width: 90%; 
            max-height: 90%; 
            border-radius: 8px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .app-header { 
                padding: 15px; 
            }

            .header-content { 
                flex-direction: column; 
                gap: 5px; 
            }

            .container { 
                margin: 10px; 
                padding: 15px; 
            }

            .control-row {
                flex-direction: column;
                align-items: stretch;
                top: 70px;
                margin-left: -15px;
                margin-right: -15px;
                padding-left: 15px;
                padding-right: 15px;
            }

            .search-wrapper { 
                width: 100%; 
            }

            .button-group, .download-group { 
                justify-content: center; 
                margin-top: 10px; 
            }

            .section-title {
                padding: 12px 15px;
                font-size: 16px;
                margin-left: -15px;
                margin-right: -15px;
            }

            table.dataTable thead th {
                padding: 10px 8px;
                font-size: 12px;
            }

            table.dataTable tbody td {
                padding: 10px 8px;
                font-size: 14px;
            }
        }

        /* Print styles */
        @media print {
            .app-header {
                position: relative;
            }
            .control-row {
                display: none;
            }
            .section-title {
                background: #1976d2 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

<div class="app-header">
    <div class="header-content">
        <div class="title-block">
            <h1>HIGH ALERT MEDICATIONS</h1>
            <div id="pageDate">Injection & Oral Reference Guide</div>
        </div>
    </div>
</div>

<div class="container">

    <!-- Control Row -->
    <div class="control-row">
        <div class="search-wrapper">
            <input type="text" id="customSearch" class="custom-search-input" placeholder="Cari nama ubat atau maklumat...">
        </div>

        <div class="button-group">
            <button id="refreshBtn" onclick="forceRefresh()" class="header-btn">
                <span class="material-icons" style="font-size: 18px;">refresh</span>
                Refresh
            </button>

            <div class="download-group">
                <span class="download-label">Muat Turun:</span>
                <a id="downloadInjection" href="https://docs.google.com/spreadsheets/d/1pSOW0oQ2J09Oq_q2O1d8nOnWwzUQ_daoSUixHxI9xYQ/export?format=pdf&gid=0" target="_blank" class="header-btn">
                    <span class="material-icons" style="font-size: 18px;">picture_as_pdf</span>
                    Injection PDF
                </a>
                <a id="downloadOral" href="https://docs.google.com/spreadsheets/d/1pSOW0oQ2J09Oq_q2O1d8nOnWwzUQ_daoSUixHxI9xYQ/export?format=pdf&gid=1948005281" target="_blank" class="header-btn">
                    <span class="material-icons" style="font-size: 18px;">picture_as_pdf</span>
                    Oral PDF
                </a>
            </div>
        </div>
    </div>

    <!-- Injection Section -->
    <div class="section-title">
        <span class="material-icons">vaccines</span>
        INJECTION (Suntikan)
    </div>

    <div id="injectionLoading" class="loading-state">
        <span class="material-icons spin">autorenew</span>
        <p>Memuatkan data Injection...</p>
    </div>

    <table id="injectionTable" style="display: none;">
        <thead></thead>
        <tbody></tbody>
    </table>

    <!-- Oral Section -->
    <div class="section-title">
        <span class="material-icons">medication</span>
        ORAL (Mulut)
    </div>

    <div id="oralLoading" class="loading-state">
        <span class="material-icons spin">autorenew</span>
        <p>Memuatkan data Oral...</p>
    </div>

    <table id="oralTable" style="display: none;">
        <thead></thead>
        <tbody></tbody>
    </table>

</div>

<!-- Image Modal -->
<div id="imgModal" class="modal" onclick="this.style.display='none'">
    <img class="modal-content" id="modalImg">
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>
    // --- CONFIG ---
    const SHEETS = {
        injection: {
            name: 'Injection',
            htmlUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSxDFAZ-cdFiY1czj9kj3KXMw1NUIX4effIsGIA1RFy026jE_oL2-xkXyrGCjc5KGAZorjFmNSD6hlM/pubhtml?gid=0&single=true&headers=false',
            csvUrl: 'https://docs.google.com/spreadsheets/d/1pSOW0oQ2J09Oq_q2O1d8nOnWwzUQ_daoSUixHxI9xYQ/export?format=csv&gid=0'
        },
        oral: {
            name: 'Oral',
            htmlUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSxDFAZ-cdFiY1czj9kj3KXMw1NUIX4effIsGIA1RFy026jE_oL2-xkXyrGCjc5KGAZorjFmNSD6hlM/pubhtml?gid=1948005281&single=true&headers=false',
            csvUrl: 'https://docs.google.com/spreadsheets/d/1pSOW0oQ2J09Oq_q2O1d8nOnWwzUQ_daoSUixHxI9xYQ/export?format=csv&gid=1948005281'
        }
    };

    const CACHE_KEY = 'medAppCache_v10';
    let injectionTable = null;
    let oralTable = null;

    // --- PARSE HTML TABLE (Preserves Bold) ---
    function parseHtmlTable(htmlText) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        const table = doc.querySelector('table');
        
        if (!table) return { headers: [], rows: [] };

        const allRows = table.querySelectorAll('tr');
        if (allRows.length === 0) return { headers: [], rows: [] };

        // First row as headers
        const headerRow = allRows[0];
        const headers = [];
        headerRow.querySelectorAll('td, th').forEach(cell => {
            headers.push(cell.textContent.trim());
        });

        // Remaining rows as data (preserve HTML for bold)
        const rows = [];
        for (let i = 1; i < allRows.length; i++) {
            const row = allRows[i];
            const rowData = {};
            const cells = row.querySelectorAll('td, th');
            
            cells.forEach((cell, index) => {
                if (index < headers.length) {
                    const headerName = headers[index];
                    // Get innerHTML to preserve <b> tags
                    rowData[headerName] = cell.innerHTML.trim();
                }
            });
            
            // Only add non-empty rows
            const hasContent = Object.values(rowData).some(v => v && v.trim() !== '');
            if (hasContent) {
                rows.push(rowData);
            }
        }

        return { headers, rows };
    }

    // --- RENDER TABLE ---
    function renderTable(tableId, data, loadingId) {
        const $loading = $('#' + loadingId);
        const $table = $('#' + tableId);

        if (!data || !data.headers || data.headers.length === 0 || !data.rows || data.rows.length === 0) {
            $loading.html(`
                <span class="material-icons error-state">error_outline</span>
                <p class="error-state">Tiada data dijumpai</p>
            `);
            return null;
        }

        // Build table HTML
        let headerHtml = '<tr>';
        data.headers.forEach(h => {
            if (h && h.trim()) {
                headerHtml += `<th>${h}</th>`;
            }
        });
        headerHtml += '</tr>';

        $table.find('thead').html(headerHtml);
        $table.find('tbody').empty();

        // Destroy existing DataTable
        if ($.fn.dataTable.isDataTable($table)) {
            $table.DataTable().clear().destroy();
        }

        $table.show();
        $loading.hide();

        // Column config
        const columnsConfig = data.headers
            .filter(h => h && h.trim())
            .map(key => ({
                data: key,
                render: function(data, type, row) {
                    if (!data) return "";
                    return data;
                }
            }));

        // Initialize DataTable
        const dt = $table.DataTable({
            data: data.rows,
            columns: columnsConfig,
            dom: 't',
            paging: false,
            info: false,
            ordering: true,
            searching: true,
            order: [],
            initComplete: function() {
                $('#refreshBtn .material-icons').removeClass('spin');
            }
        });

        return dt;
    }

    // --- FETCH DATA ---
    async function fetchSheetData(sheetKey, force = false) {
        const sheet = SHEETS[sheetKey];
        const cacheKey = `${CACHE_KEY}_${sheetKey}`;
        const now = Date.now();

        // Try cache first
        if (!force) {
            const cached = localStorage.getItem(cacheKey);
            if (cached) {
                try {
                    const parsed = JSON.parse(cached);
                    return parsed.data;
                } catch (e) {
                    console.error('Cache parse error:', e);
                }
            }
        }

        try {
            // Use CORS proxy for HTML fetch
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(sheet.htmlUrl)}`;
            const response = await fetch(proxyUrl);
            const htmlText = await response.text();
            
            const data = parseHtmlTable(htmlText);
            
            // Cache the result
            localStorage.setItem(cacheKey, JSON.stringify({
                timestamp: now,
                data: data
            }));

            return data;
        } catch (error) {
            console.error(`Error fetching ${sheet.name}:`, error);
            return null;
        }
    }

    // --- LOAD ALL DATA ---
    async function loadAllData(force = false) {
        if (force) {
            $('#refreshBtn .material-icons').addClass('spin');
            $('#injectionLoading').html('<span class="material-icons spin">autorenew</span><p>Memuat semula...</p>').show();
            $('#oralLoading').html('<span class="material-icons spin">autorenew</span><p>Memuat semula...</p>').show();
            $('#injectionTable, #oralTable').hide();
        }

        // Fetch both sheets in parallel
        const [injectionData, oralData] = await Promise.all([
            fetchSheetData('injection', force),
            fetchSheetData('oral', force)
        ]);

        // Render tables
        injectionTable = renderTable('injectionTable', injectionData, 'injectionLoading');
        oralTable = renderTable('oralTable', oralData, 'oralLoading');

        // Re-apply search
        const currentSearch = $('#customSearch').val();
        if (currentSearch) {
            if (injectionTable) injectionTable.search(currentSearch).draw();
            if (oralTable) oralTable.search(currentSearch).draw();
        }

        $('#refreshBtn .material-icons').removeClass('spin');
    }

    // --- FORCE REFRESH ---
    function forceRefresh() {
        loadAllData(true);
    }

    // --- SEARCH HANDLER ---
    function handleSearch(value) {
        if (injectionTable && $.fn.dataTable.isDataTable('#injectionTable')) {
            injectionTable.search(value).draw();
        }
        if (oralTable && $.fn.dataTable.isDataTable('#oralTable')) {
            oralTable.search(value).draw();
        }
    }

    // --- INIT ---
    $(document).ready(function() {
        loadAllData();

        // Search input
        $('#customSearch').on('keyup clear', function() {
            handleSearch($(this).val());
        });

        // Auto-refresh every 5 minutes
        setInterval(() => loadAllData(false), 300000);
    });
</script>
</body>
</html>
