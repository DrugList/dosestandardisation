<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medication Database</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --bg: #0a0f1c;
            --bg-elevated: #111827;
            --bg-card: #1a2332;
            --fg: #f1f5f9;
            --fg-muted: #94a3b8;
            --accent: #10b981;
            --accent-hover: #34d399;
            --accent-glow: rgba(16, 185, 129, 0.3);
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.2);
            --border: #2d3a4f;
            --header-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 20% 0%, rgba(16, 185, 129, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(59, 130, 246, 0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .app-header {
            background: linear-gradient(180deg, var(--header-bg) 0%, rgba(15, 23, 42, 0.95) 100%);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px 24px;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 16px;
        }

        .title-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent) 0%, #059669 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px var(--accent-glow);
            flex-shrink: 0;
        }

        .logo-icon .material-icons {
            color: white;
            font-size: 24px;
        }

        .title-block h1 {
            margin: 0;
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(18px, 3vw, 24px);
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--fg);
            transition: all 0.3s ease;
        }

        .title-block .page-date {
            font-size: 13px;
            color: var(--fg-muted);
            margin-top: 2px;
            font-weight: 500;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 2px 8px var(--accent-glow);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--fg);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-elevated);
            border-color: var(--accent);
        }

        .btn .material-icons {
            font-size: 18px;
        }

        .btn.spin .material-icons {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .tabs-wrapper {
            display: flex;
            gap: 4px;
            background: var(--bg);
            padding: 4px;
            border-radius: 12px;
            width: fit-content;
        }

        .tab-btn {
            padding: 10px 28px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            background: transparent;
            color: var(--fg-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .tab-btn:hover {
            color: var(--fg);
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 2px 8px var(--accent-glow);
        }

        .tab-btn .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            font-size: 11px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin-left: 8px;
        }

        .tab-btn:not(.active) .badge {
            background: var(--border);
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
            position: relative;
            z-index: 1;
        }

        .definition-box {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(59, 130, 246, 0.05) 100%);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-left: 4px solid var(--accent);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 20px;
            display: none;
        }

        .definition-box.visible {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .definition-box p {
            margin: 0;
            font-size: 14px;
            line-height: 1.7;
            color: var(--fg);
        }

        .search-container {
            margin-bottom: 20px;
        }

        .search-wrapper {
            position: relative;
            max-width: 400px;
        }

        .search-wrapper .material-icons {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--fg-muted);
            font-size: 20px;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            font-size: 15px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--fg);
            transition: all 0.2s ease;
        }

        .search-input::placeholder {
            color: var(--fg-muted);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .loading-state {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .loading-state p {
            color: var(--fg-muted);
            font-size: 15px;
            margin: 0;
        }

        /* FIXED: Table container now allows horizontal scroll */
        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
        }

        /* NEW: Scrollable wrapper for the table */
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) var(--bg);
        }

        .table-wrapper::-webkit-scrollbar {
            height: 8px;
        }

        .table-wrapper::-webkit-scrollbar-track {
            background: var(--bg);
            border-radius: 4px;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* Scroll hint for mobile */
        .scroll-hint {
            display: none;
            padding: 12px 16px;
            background: rgba(16, 185, 129, 0.1);
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            color: var(--fg-muted);
            text-align: center;
        }

        .scroll-hint .material-icons {
            font-size: 16px;
            vertical-align: middle;
            margin-right: 6px;
            animation: swipeHint 1.5s ease-in-out infinite;
        }

        @keyframes swipeHint {
            0%, 100% { transform: translateX(-4px); }
            50% { transform: translateX(4px); }
        }

        #dataTable {
            width: 100% !important;
            border-collapse: collapse !important;
            min-width: 800px;
        }

        #dataTable thead {
            background: var(--bg-elevated);
        }

        #dataTable th {
            background: transparent;
            color: var(--fg);
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 16px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        #dataTable td {
            padding: 16px 14px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
            font-size: 14px;
            line-height: 1.6;
            color: var(--fg);
            background: transparent;
        }

        #dataTable tbody tr {
            transition: background 0.15s ease;
        }

        #dataTable tbody tr:hover {
            background: rgba(16, 185, 129, 0.05);
        }

        #dataTable tbody tr:last-child td {
            border-bottom: none;
        }

        #dataTable td:first-child {
            font-weight: 600;
            color: var(--accent);
        }

        .table-img {
            width: 72px;
            height: 72px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid var(--border);
            transition: all 0.2s ease;
            background: var(--bg);
        }

        .table-img:hover {
            transform: scale(1.08);
            border-color: var(--accent);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .no-image, .img-error {
            color: var(--fg-muted);
            font-style: italic;
            font-size: 13px;
        }

        .img-error {
            color: var(--danger);
        }

        .bold-text {
            font-weight: 700;
            color: var(--fg);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        .error-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--bg-card);
            border: 1px solid var(--danger);
            border-radius: 16px;
        }

        .error-state .material-icons {
            font-size: 48px;
            color: var(--danger);
            margin-bottom: 16px;
        }

        .error-state h3 {
            margin: 0 0 8px;
            color: var(--fg);
            font-size: 18px;
        }

        .error-state p {
            margin: 0;
            color: var(--fg-muted);
            font-size: 14px;
        }

        .dataTables_empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--fg-muted);
            font-size: 15px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-inner {
                padding: 12px 16px;
            }

            .header-top {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .header-actions {
                width: 100%;
                justify-content: flex-start;
            }

            .btn {
                padding: 8px 14px;
                font-size: 13px;
            }

            .tabs-wrapper {
                width: 100%;
            }

            .tab-btn {
                flex: 1;
                text-align: center;
                padding: 12px 16px;
            }

            .main-container {
                padding: 16px;
            }

            .search-wrapper {
                max-width: none;
            }

            #dataTable th,
            #dataTable td {
                padding: 12px 10px;
                font-size: 13px;
            }

            .table-img {
                width: 56px;
                height: 56px;
            }

            /* Show scroll hint on mobile */
            .scroll-hint {
                display: block;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

<div class="app-header">
    <div class="header-inner">
        <div class="header-top">
            <div class="title-section">
                <div class="logo-icon">
                    <span class="material-icons">medication</span>
                </div>
                <div class="title-block">
                    <h1 id="pageTitle">MEDICATION DATABASE</h1>
                    <div class="page-date" id="pageDate"></div>
                </div>
            </div>
            <div class="header-actions">
                <button id="refreshBtn" class="btn btn-secondary" onclick="forceRefresh()">
                    <span class="material-icons">refresh</span>
                    Refresh
                </button>
                <a id="pdfButton" href="#" target="_blank" class="btn btn-primary" style="display: none;">
                    <span class="material-icons">download</span>
                    Muat Turun PDF
                </a>
            </div>
        </div>
        <div class="tabs-wrapper">
            <button class="tab-btn active" data-tab="injection" onclick="switchTab('injection')">
                Injection
                <span class="badge" id="injection-count">-</span>
            </button>
            <button class="tab-btn" data-tab="oral" onclick="switchTab('oral')">
                Oral
                <span class="badge" id="oral-count">-</span>
            </button>
        </div>
    </div>
</div>

<div class="main-container">
    <div id="pageDefinition" class="definition-box"></div>

    <div class="search-container">
        <div class="search-wrapper">
            <span class="material-icons">search</span>
            <input type="text" id="customSearch" class="search-input" placeholder="Search medications...">
        </div>
    </div>

    <div id="loadingState" class="loading-state">
        <div class="loading-spinner"></div>
        <p>Loading medication data...</p>
    </div>

    <div id="errorState" class="error-state" style="display: none;">
        <span class="material-icons">error_outline</span>
        <h3>Failed to Load Data</h3>
        <p>Please check your connection and try again.</p>
    </div>

    <div class="table-container">
        <!-- NEW: Scroll hint for mobile users -->
        <div class="scroll-hint">
            <span class="material-icons">swipe</span>
            Scroll left/right to see more columns
        </div>
        <!-- NEW: Wrapper for horizontal scrolling -->
        <div class="table-wrapper">
            <table id="dataTable">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<div id="imgModal" class="modal" onclick="closeModal()">
    <button class="modal-close">
        <span class="material-icons">close</span>
    </button>
    <img class="modal-content" id="modalImg">
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>
    // =============================================
    // CONFIGURATION
    // =============================================
    const SHEET_ID = '1pSOW0oQ2J09Oq_q2O1d8nOnWwzUQ_daoSUixHxI9xYQ';
    
    const TABS_CONFIG = {
        injection: {
            gid: '0',
            name: 'Injection'
        },
        oral: {
            gid: '1948005281',
            name: 'Oral'
        }
    };

    const CONFIG_COLUMNS = ['CONFIG_TITLE', 'CONFIG_PDF', 'CONFIG_DATE', 'CONFIG_DEFINITION'];
    const CACHE_KEY_PREFIX = 'medAppCache_v11_';
    
    // State
    let currentTab = 'injection';
    let dataTableInstance = null;
    let allData = {
        injection: null,
        oral: null
    };

    // =============================================
    // UTILITY FUNCTIONS
    // =============================================
    
    function getCsvUrl(gid) {
        const timestamp = new Date().getTime();
        return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}&t=${timestamp}`;
    }

    function getImageUrl(rawUrl) {
        if (!rawUrl || !rawUrl.trim()) return null;
        let url = rawUrl.trim();
        let id = null;

        let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (match) id = match[1];
        if (!id) {
            match = url.match(/id=([a-zA-Z0-9_-]+)/);
            if (match) id = match[1];
        }

        if (id) return `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;
        if (url.match(/\.(jpeg|jpg|gif|png|webp)$/i)) return url;
        return null;
    }

    function getPdfViewUrl(rawUrl) {
        if (!rawUrl || !rawUrl.trim()) return null;
        let url = rawUrl.trim();
        let id = null;
        let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (match) id = match[1];
        if (!id) {
            match = url.match(/id=([a-zA-Z0-9_-]+)/);
            if (match) id = match[1];
        }
        if (id) return `https://drive.google.com/file/d/${id}/view`;
        return url;
    }

    function parseBoldText(text) {
        if (!text) return '';
        let result = text.toString();
        
        result = result
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
        
        result = result
            .replace(/&lt;b&gt;/gi, '<b>')
            .replace(/&lt;\/b&gt;/gi, '</b>')
            .replace(/&lt;strong&gt;/gi, '<strong>')
            .replace(/&lt;\/strong&gt;/gi, '</strong>');
        
        result = result.replace(/\*\*([^*]+)\*\*/g, '<b class="bold-text">$1</b>');
        result = result.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        
        return result;
    }

    // =============================================
    // DATA FETCHING
    // =============================================
    
    async function fetchTabData(tabKey, force = false) {
        const config = TABS_CONFIG[tabKey];
        const cacheKey = CACHE_KEY_PREFIX + tabKey;
        const now = new Date().getTime();
        
        if (!force) {
            const cachedRaw = localStorage.getItem(cacheKey);
            if (cachedRaw) {
                try {
                    const cached = JSON.parse(cachedRaw);
                    if (cached.timestamp && (now - cached.timestamp < 300000)) {
                        return cached.data;
                    }
                } catch (e) {
                    console.error('Cache parse error:', e);
                }
            }
        }

        try {
            const url = getCsvUrl(config.gid);
            const response = await fetch(url);
            
            if (!response.ok) throw new Error('Network response not ok');
            
            const csvText = await response.text();
            const result = Papa.parse(csvText, { 
                header: true, 
                skipEmptyLines: true 
            });
            
            const data = result.data;
            
            localStorage.setItem(cacheKey, JSON.stringify({
                timestamp: now,
                data: data
            }));
            
            return data;
        } catch (error) {
            console.error(`Error fetching ${tabKey}:`, error);
            
            const cachedRaw = localStorage.getItem(cacheKey);
            if (cachedRaw) {
                try {
                    return JSON.parse(cachedRaw).data;
                } catch (e) {}
            }
            
            throw error;
        }
    }

    async function loadAllData(forceRefresh = false) {
        const refreshBtn = document.getElementById('refreshBtn');
        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        
        if (forceRefresh) {
            refreshBtn.classList.add('spin');
        }
        
        loadingState.style.display = 'block';
        errorState.style.display = 'none';

        try {
            const [injectionData, oralData] = await Promise.all([
                fetchTabData('injection', forceRefresh),
                fetchTabData('oral', forceRefresh)
            ]);

            allData.injection = injectionData;
            allData.oral = oralData;

            document.getElementById('injection-count').textContent = 
                injectionData ? injectionData.length : '0';
            document.getElementById('oral-count').textContent = 
                oralData ? oralData.length : '0';

            loadingState.style.display = 'none';
            
            renderTable(currentTab);

        } catch (error) {
            console.error('Load error:', error);
            loadingState.style.display = 'none';
            errorState.style.display = 'block';
        } finally {
            refreshBtn.classList.remove('spin');
        }
    }

    // =============================================
    // TABLE RENDERING
    // =============================================
    
    function renderTable(tabKey) {
        const data = allData[tabKey];
        
        if (!data || data.length === 0) {
            console.warn('No data for tab:', tabKey);
            return;
        }

        const firstRow = data[0];

        const titleEl = document.getElementById('pageTitle');
        const dateEl = document.getElementById('pageDate');
        const definitionEl = document.getElementById('pageDefinition');
        const pdfBtn = document.getElementById('pdfButton');

        if (firstRow['CONFIG_TITLE']) {
            titleEl.textContent = firstRow['CONFIG_TITLE'];
            document.title = firstRow['CONFIG_TITLE'];
        } else {
            titleEl.textContent = `${TABS_CONFIG[tabKey].name} Medications`;
            document.title = `${TABS_CONFIG[tabKey].name} Medications`;
        }

        if (firstRow['CONFIG_DATE']) {
            dateEl.textContent = firstRow['CONFIG_DATE'];
        } else {
            dateEl.textContent = '';
        }

        if (firstRow['CONFIG_DEFINITION']) {
            definitionEl.innerHTML = `<p>${parseBoldText(firstRow['CONFIG_DEFINITION'])}</p>`;
            definitionEl.classList.add('visible');
        } else {
            definitionEl.classList.remove('visible');
        }

        if (firstRow['CONFIG_PDF']) {
            const pdfUrl = getPdfViewUrl(firstRow['CONFIG_PDF']);
            if (pdfUrl) {
                pdfBtn.href = pdfUrl;
                pdfBtn.style.display = 'inline-flex';
            } else {
                pdfBtn.style.display = 'none';
            }
        } else {
            pdfBtn.style.display = 'none';
        }

        const allHeaders = Object.keys(firstRow);
        const tableHeaders = allHeaders.filter(h => !CONFIG_COLUMNS.includes(h));

        if (dataTableInstance) {
            dataTableInstance.clear().destroy();
            $('#dataTable').empty();
        }

        let tableHtml = '<thead><tr>';
        tableHeaders.forEach(h => {
            tableHtml += `<th>${h}</th>`;
        });
        tableHtml += '</tr></thead><tbody></tbody>';
        $('#dataTable').html(tableHtml);

        const columnsConfig = tableHeaders.map(key => {
            return {
                data: key,
                render: function(data, type, row) {
                    if (!data) return '';
                    
                    const rawVal = data.toString();
                    
                    const imgUrl = getImageUrl(rawVal);
                    if (imgUrl) {
                        return `<img src="${imgUrl}" class="table-img" onclick="zoomImage('${imgUrl}')" onerror="this.outerHTML='<span class=\\'img-error\\'>Image Error</span>'" alt="Medication Image">`;
                    }
                    
                    if (rawVal.toLowerCase() === 'no image') {
                        return '<span class="no-image">No Image</span>';
                    }
                    
                    return parseBoldText(rawVal);
                }
            };
        });

        dataTableInstance = $('#dataTable').DataTable({
            data: data,
            columns: columnsConfig,
            dom: 't',
            paging: false,
            info: false,
            ordering: true,
            searching: true,
            order: [],
            language: {
                emptyTable: 'No medications found',
                zeroRecords: 'No matching medications found'
            },
            initComplete: function() {
                const currentSearch = $('#customSearch').val();
                if (currentSearch) {
                    this.api().search(currentSearch).draw();
                }
            }
        });
    }

    // =============================================
    // TAB SWITCHING
    // =============================================
    
    function switchTab(tabKey) {
        if (tabKey === currentTab) return;

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.tab === tabKey);
        });

        currentTab = tabKey;

        if (allData[tabKey]) {
            renderTable(tabKey);
        } else {
            loadAllData();
        }
    }

    // =============================================
    // UI FUNCTIONS
    // =============================================
    
    function forceRefresh() {
        const cacheKey = CACHE_KEY_PREFIX + currentTab;
        localStorage.removeItem(cacheKey);
        
        loadAllData(true);
    }

    function zoomImage(src) {
        const modal = document.getElementById('imgModal');
        const modalImg = document.getElementById('modalImg');
        modal.classList.add('active');
        modalImg.src = src;
    }

    function closeModal() {
        const modal = document.getElementById('imgModal');
        modal.classList.remove('active');
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeModal();
        }
    });

    // =============================================
    // INITIALIZATION
    // =============================================
    
    $(document).ready(function() {
        loadAllData();

        $('#customSearch').on('keyup clear', function() {
            if (dataTableInstance) {
                dataTableInstance.search($(this).val()).draw();
            }
        });

        setInterval(() => {
            loadAllData(false);
        }, 300000);
    });
</script>

</body>
</html>
